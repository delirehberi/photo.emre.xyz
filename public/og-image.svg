<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Amber Accent line at top -->
  <rect x="0" y="0" width="1200" height="6" fill="#f59e0b" />

  <g transform="translate(120, 160)">
    <!-- Camera Icon Badge -->
    <rect x="0" y="0" width="76" height="76" rx="18" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="2" />
    <g transform="translate(18, 18) scale(1.66)" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>
      <circle cx="12" cy="13" r="3"/>
    </g>

    <!-- Title -->
    <text x="100" y="54" font-family="system-ui, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">
      Phoem
    </text>

    <!-- Tagline -->
    <text x="0" y="160" font-family="system-ui, sans-serif" font-size="42" font-weight="700" fill="#f4f4f5" letter-spacing="-0.5">
      Sovereign Event Photo Albums
    </text>

    <text x="0" y="215" font-family="system-ui, sans-serif" font-size="24" font-weight="400" fill="#a1a1aa">
      Independent, censorship-resistant photo galleries for sovereign communities.
    </text>

    <!-- Feature tags -->
    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="140" height="40" rx="20" fill="#27272a" stroke="#3f3f46" />
      <text x="70" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#fbbf24">
        NOSTR
      </text>

      <rect x="155" y="0" width="175" height="40" rx="20" fill="#27272a" stroke="#3f3f46" />
      <text x="242" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#fbbf24">
        BLOSSOM MEDIA
      </text>

      <rect x="345" y="0" width="155" height="40" rx="20" fill="#27272a" stroke="#3f3f46" />
      <text x="422" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#fbbf24">
        LIGHTNING
      </text>

      <rect x="515" y="0" width="180" height="40" rx="20" fill="#27272a" stroke="#3f3f46" />
      <text x="605" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#fbbf24">
        ZERO DATABASE
      </text>
    </g>

    <!-- Domain Footer -->
    <text x="0" y="370" font-family="monospace" font-size="20" font-weight="500" fill="#71717a">
      https://photo.emre.xyz
    </text>
